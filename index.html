<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="为有 Python 基础的学习者设计的 LangChain 交互式教程：从模型调用、Prompt、RAG 到 Agent 与企业项目。">
  <title>LangChain 互动学习站 · 从 API 到 Agent</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/lessons.css">
  <link rel="stylesheet" href="assets/css/labs.css">
  <script>
    try {
      const savedTheme = localStorage.getItem('lc-atlas-theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (error) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <div class="reading-progress" aria-hidden="true"><span id="readingProgressBar"></span></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="课程侧边栏">
      <a class="brand" href="#home" data-route="home" aria-label="返回学习地图">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M12 10v21.5c0 3.6 2.9 6.5 6.5 6.5H36" />
            <path d="M20 17h16M20 24h16" />
            <circle cx="12" cy="10" r="3" />
            <circle cx="36" cy="17" r="3" />
            <circle cx="36" cy="24" r="3" />
          </svg>
        </span>
        <span class="brand-copy"><strong>LangChain</strong><small>互动学习站</small></span>
      </a>

      <section class="sidebar-progress" aria-label="整体学习进度">
        <div class="sidebar-progress-head">
          <span>学习进度</span>
          <strong id="sidebarProgressText">0%</strong>
        </div>
        <div class="progress-track"><span id="sidebarProgressBar"></span></div>
        <p id="sidebarProgressHint">完成第一章，迈出第一步。</p>
      </section>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="课程导航">
        <button class="nav-home is-active" data-route="home">
          <span class="nav-icon">⌂</span>
          <span>学习地图</span>
        </button>
        <div class="nav-label"><span>COURSE</span><span>10 章</span></div>
        <!-- 章节导航由 app.js 生成 -->
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-note">
          <span class="note-spark">✦</span>
          <p>建议按顺序学习。每章的实验都不需要消耗 API 额度。</p>
        </div>
        <div class="sidebar-actions">
          <button class="icon-text-button" id="themeToggle" type="button" aria-label="切换深浅色主题">
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
            <span>切换外观</span>
          </button>
          <button class="icon-text-button" id="resetProgress" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span>重置进度</span>
          </button>
        </div>
      </div>
    </aside>

    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭导航"></button>

    <div class="main-shell">
      <header class="topbar">
        <button class="menu-button" id="menuButton" type="button" aria-label="打开课程导航" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="breadcrumb" id="breadcrumb" aria-label="面包屑">
          <span>LangChain Atlas</span><i>/</i><strong>学习地图</strong>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" id="searchTrigger" type="button" aria-label="搜索课程内容">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span>搜索课程</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="continue-button" id="continueButton" type="button">
            <span>继续学习</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>

      <footer class="site-footer">
        <div><strong>LangChain Atlas</strong><span>把复杂概念拆开，再亲手装回去。</span></div>
        <div class="footer-links">
          <a href="https://docs.langchain.com/" target="_blank" rel="noreferrer">官方文档 ↗</a>
          <span>按 LangChain 1.x 风格整理</span>
        </div>
      </footer>
    </div>
  </div>

  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <div class="search-dialog" role="dialog" aria-modal="true" aria-label="搜索课程">
      <div class="search-box">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" type="search" placeholder="搜索 RAG、Agent、结构化输出…" autocomplete="off" aria-label="搜索课程">
        <button class="search-close" id="searchClose" type="button" aria-label="关闭搜索">ESC</button>
      </div>
      <div class="search-meta" id="searchMeta">输入关键词，快速跳转到对应章节。</div>
      <div class="search-results" id="searchResults"></div>
      <div class="search-hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>Enter</kbd> 打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/course-meta.js"></script>
  <script src="assets/js/lesson-01.js"></script>
  <script src="assets/js/lesson-02.js"></script>
  <script src="assets/js/lesson-03.js"></script>
  <script src="assets/js/lesson-04.js"></script>
  <script src="assets/js/lesson-05.js"></script>
  <script src="assets/js/lesson-06.js"></script>
  <script src="assets/js/lesson-07.js"></script>
  <script src="assets/js/lesson-08.js"></script>
  <script src="assets/js/lesson-09.js"></script>
  <script src="assets/js/lesson-10.js"></script>
  <script src="assets/js/labs.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
